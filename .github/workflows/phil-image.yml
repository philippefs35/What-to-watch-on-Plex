# Personal build of the fork for philippefs35's server. Not part of the upstream PR.
name: Build personal image (ghcr)

on:
  push:
    branches: [phil-image]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/philippefs35/wtwp:latest
            ghcr.io/philippefs35/wtwp:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
